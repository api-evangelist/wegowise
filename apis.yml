  - Commercial Areas
  - Multifamily
  - Pro
  properties:
  - type: Documentation
    url: https://www.wegowise.com/api/wego_pro
- aid: wegowise:wegowise-data
  name: WegoWise Data API
  description: >-
    The WegoData API for data-only accounts. Enables meter management and automated utility data import
    without the full building structure hierarchy. Supports all utility types: Electric, Gas, Oil, Water,
    Steam, Propane, Solar.
  humanURL: https://www.wegowise.com/api/wego_data
  baseUrl: https://www.wegowise.com/api/v1/wego_data
  tags:
  - Automated Import
  - Data Only
  - Meters
  - Utility Data
  properties:
  - type: Documentation
    url: https://www.wegowise.com/api/wego_data
- aid: wegowise:wegowise-public
  name: WegoWise Public API
  description: >-
    Public endpoints accessible without authentication. Provides a list of utility companies supported
    for automated data import, useful for finding utility_company_id values when configuring meters.
  humanURL: https://www.wegowise.com/api/public
  baseUrl: https://www.wegowise.com/api/v1
  tags:
  - Public
  - Utility Companies
  properties:
  - type: Documentation
    url: https://www.wegowise.com/api/public
