apis:
- aid: wegowise:wegowise-pro
  name: WegoWise Pro API
  description: >-
    The WegoPro API for multifamily and commercial property portfolios. Provides endpoints for buildings,
    apartments, areas, meters, raw data, and monthly normalized usage data. The primary API for property
    managers.
  humanURL: https://www.wegowise.com/api/wego_pro
  baseUrl: https://www.wegowise.com/api/v1/wego_pro
  tags:
  - Apartments
