aid: wegowise
name: WegoWise
description: >-
  WegoWise (now Comply by Measurabl) is a building energy and water benchmarking platform enabling property owners,
  managers, and energy service providers to programmatically manage building portfolios, track utility meter data, and
  benchmark energy and water performance. The REST API supports building management, apartment and commercial area
  tracking, utility meter data import, and normalized monthly usage analytics across multifamily and commercial
  properties.
type: Index
accessModel:
  pricing: enterprise
  onboarding: self-serve
  trial: false
  try_now: false
  public: false
  label: Enterprise · Self-serve signup
  confidence: high
  source:
  - plans
  - authentication
  generated: '2026-07-22'
  method: derived
